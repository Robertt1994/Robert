<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Vicente</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #1a1a1a; color: #fff; overflow: hidden; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding-top: 10px; }

        /* Barra de navegación superior */
        .top-navbar { width: 95%; max-width: 450px; display: flex; justify-content: space-around; background: #222; padding: 10px; border-radius: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); margin-bottom: 15px; border: 1px solid #333; z-index: 1000; }
        .nav-tab { background: none; border: none; color: #aaa; font-size: 14px; font-weight: bold; padding: 8px 16px; cursor: pointer; border-radius: 20px; transition: 0.3s; }
        .nav-tab.active { background: #ff4757; color: white; box-shadow: 0 2px 8px rgba(255, 71, 87, 0.4); }

        /* Contenedor Principal del Libro */
        .book-container { width: 95%; max-width: 450px; height: 75vh; perspective: 1500px; position: relative; }

        /* Estructura de la Página */
        .page { width: 100%; height: 100%; position: absolute; top: 0; left: 0; transform-style: preserve-3d; transform-origin: left center; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); z-index: 1; pointer-events: none; }
        .page-front, .page-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; background: #222; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); padding: 20px; display: flex; flex-direction: column; pointer-events: auto; border: 1px solid #333; }
        .page-back { transform: rotateY(180deg); background: #292929; }

        /* NUEVOS ESTILOS: Portada con imagen completa de fondo */
        .cover-front { 
            position: relative;
            padding: 0 !important; 
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* Empuja el texto hacia abajo */
            align-items: center;
        }
        
        /* La foto ahora cubre todo el fondo */
        .cover-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* Hace que llene todo sin deformarse */
            z-index: 1;
        }

        /* Capa oscura intermedia para que el nombre resalte y se pueda leer bien */
        .cover-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.4) 60%, transparent 100%);
            z-index: 2;
        }

        /* Bloque de texto flotante */
        .cover-content {
            position: relative;
            z-index: 3;
            text-align: center;
            margin-bottom: 40px; /* Separación del borde inferior */
            padding: 0 20px;
        }
        .cover-content h1 { 
            font-size: 38px; 
            color: #fff; 
            text-transform: uppercase; 
            letter-spacing: 4px; 
            font-weight: 900;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }
        .cover-content p { 
            color: #ccc; 
            font-size: 14px; 
            margin-top: 8px;
            text-shadow: 0 1px 5px rgba(0,0,0,0.8);
        }

        /* Estados del volteo */
        .page.flipped { transform: rotateY(-180deg); }
        .page.active-z { z-index: 10; }
        .page.low-z { z-index: 0; }

        .page h2 { text-align: center; color: #ff4757; font-size: 22px; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 2px; border-bottom: 2px solid #333; padding-bottom: 8px; }

        /* Grid de Fotos */
        .gallery-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; overflow-y: auto; flex-grow: 1; padding-right: 5px; }
        .gallery-grid::-webkit-scrollbar { width: 4px; }
        .gallery-grid::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }

        /* Tarjeta de Producto */
        .product-card { background: #1e1e1e; border-radius: 8px; padding: 6px; text-align: center; border: 1px solid #2d2d2d; }
        .product-card img { width: 100%; height: 120px; object-fit: cover; border-radius: 6px; background: #333; }
        .product-card p { font-size: 11px; margin-top: 5px; color: #aaa; font-weight: bold; }

        /* Controles */
        .nav-controls { display: flex; gap: 20px; margin-top: 15px; z-index: 100; margin-bottom: 10px; }
        .nav-btn { background: #ff4757; color: white; border: none; padding: 10px 22px; border-radius: 50px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4); transition: 0.2s; font-size: 14px; }

        .page-front::after { content: ''; position: absolute; left: 0; top: 0; width: 15px; height: 100%; background: linear-gradient(to right, rgba(0,0,0,0.3), transparent); }
        .page-back::after { content: ''; position: absolute; right: 0; top: 0; width: 15px; height: 100%; background: linear-gradient(to left, rgba(0,0,0,0.3), transparent); }
    </style>
</head>
<body>

<div class="top-navbar">
    <button class="nav-tab active" id="tab-inicio" onclick="irASeccion(0, 'inicio')">Inicio</button>
    <button class="nav-tab" id="tab-zapatos" onclick="irASeccion(1, 'zapatos')">Zapatos</button>
    <button class="nav-tab" id="tab-conjuntos" onclick="irASeccion(2, 'conjuntos')">Conjuntos</button>
    <button class="nav-tab" id="tab-gym" onclick="irASeccion(3, 'gym')">Gym</button>
</div>

<div class="book-container">

    <!-- HOJA 0: LA PORTADA (ESTRUCTURA CORREGIDA) -->
    <div class="page active-z" id="page0">
        <div class="page-front cover-front">
            <img src="portada.jpg" class="cover-bg" alt="Portada">
            <div class="cover-overlay"></div>
            <div class="cover-content">
                <h1>Vicente</h1>
                <p>Desliza o dale a Siguiente</p>
            </div>
        </div>
        <div class="page-back"></div>
    </div>

    <!-- HOJA 1: ZAPATOS -->
    <div class="page" id="page1">
        <div class="page-front">
            <h2>Zapatos 1</h2>
            <div class="gallery-grid" id="grid-zapatos-1"></div>
        </div>
        <div class="page-back">
            <h2>Zapatos 2</h2>
            <div class="gallery-grid" id="grid-zapatos-2"></div>
        </div>
    </div>

    <!-- HOJA 2: CONJUNTOS -->
    <div class="page" id="page2">
        <div class="page-front">
            <h2>Conjuntos 1</h2>
            <div class="gallery-grid" id="grid-conjuntos-1"></div>
        </div>
        <div class="page-back">
            <h2>Conjuntos 2</h2>
            <div class="gallery-grid" id="grid-conjuntos-2"></div>
        </div>
    </div>

    <!-- HOJA 3: GYM -->
    <div class="page" id="page3">
        <div class="page-front">
            <h2>Ropa Gym 1</h2>
            <div class="gallery-grid" id="grid-gym-1"></div>
        </div>
        <div class="page-back">
            <h2>Ropa Gym 2</h2>
            <div class="gallery-grid" id="grid-gym-2"></div>
        </div>
    </div>

</div>

<div class="nav-controls">
    <button class="nav-btn" onclick="prevPage()">◀ Anterior</button>
    <button class="nav-btn" onclick="nextPage()">Siguiente ▶</button>
</div>

<script>
    function generarFotosLibro(idContenedor, prefijo, inicio, fin) {
        var contenedor = document.getElementById(idContenedor);
        for (var i = inicio; i <= fin; i++) {
            var card = document.createElement('div');
            card.className = 'product-card';
            var img = document.createElement('img');
            
            img.src = prefijo + i + '.jpg'; 
            img.alt = prefijo + ' ' + i;
            
            img.onerror = function() { this.parentElement.style.display = 'none'; };
            var p = document.createElement('p');
            p.innerText = 'Ref: ' + prefijo.toUpperCase() + '-' + i;
            card.appendChild(img);
            card.appendChild(p);
            contenedor.appendChild(card);
        }
    }

    window.onload = function() {
        generarFotosLibro('grid-zapatos-1', 'zapatos', 1, 25);
        generarFotosLibro('grid-zapatos-2', 'zapatos', 26, 50);
        
        generarFotosLibro('grid-conjuntos-1', 'conjunto', 1, 25);
        generarFotosLibro('grid-conjuntos-2', 'conjunto', 26, 50);
        
        generarFotosLibro('grid-gym-1', 'gym', 1, 25);
        generarFotosLibro('grid-gym-2', 'gym', 26, 50);
    };

    var currentSheet = 0; 
    var totalSheets = 3; 

    function nextPage() {
        if (currentSheet < totalSheets) {
            var sheet = document.getElementById('page' + currentSheet);
            sheet.classList.add('flipped');
            sheet.classList.remove('active-z');
            sheet.classList.add('low-z');
            
            currentSheet++;
            var nextSheet = document.getElementById('page' + currentSheet);
            if (nextSheet) nextSheet.classList.add('active-z');
            actualizarPestañasMenu();
        }
    }

    function prevPage() {
        if (currentSheet > 0) {
            var oldSheet = document.getElementById('page' + currentSheet);
            if (oldSheet) oldSheet.classList.remove('active-z');
            
            currentSheet--;
            var sheet = document.getElementById('page' + currentSheet);
            sheet.classList.remove('flipped');
            sheet.classList.remove('low-z');
            sheet.classList.add('active-z');
            actualizarPestañasMenu();
        }
    }

    function irASeccion(hojaDestino, idTab) {
        while (currentSheet < hojaDestino) {
            var sheet = document.getElementById('page' + currentSheet);
            sheet.classList.add('flipped');
            sheet.classList.remove('active-z');
            sheet.classList.add('low-z');
            currentSheet++;
        }
        while (currentSheet > hojaDestino) {
            var oldSheet = document.getElementById('page' + currentSheet);
            if (oldSheet) oldSheet.classList.remove('active-z');
            currentSheet--;
            var sheet = document.getElementById('page' + currentSheet);
            sheet.classList.remove('flipped');
            sheet.classList.remove('low-z');
        }
        document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active-z'); });
        document.getElementById('page' + currentSheet).classList.add('active-z');
        actualizarPestañasMenu();
    }

    function actualizarPestañasMenu() {
        document.querySelectorAll('.nav-tab').forEach(function(tab) { tab.classList.remove('active'); });
        if (currentSheet === 0) document.getElementById('tab-inicio').classList.add('active');
        if (currentSheet === 1) document.getElementById('tab-zapatos').classList.add('active');
        if (currentSheet === 2) document.getElementById('tab-conjuntos').classList.add('active');
        if (currentSheet === 3) document.getElementById('tab-gym').classList.add('active');
    }
</script>

</body>
</html>
